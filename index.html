const DIG=['零','一','二','三','四','五','六','七','八','九'];
function cn(n){
  if(n===0)return '零';
  const d=[Math.floor(n/1000)%10,Math.floor(n/100)%10,Math.floor(n/10)%10,n%10];
  const units=['千','百','十',''];
  let s='',zero=false;
  for(let i=0;i<4;i++){
    if(d[i]===0){if(s)zero=true;continue;}
    if(zero){s+='零';zero=false;}
    if(i===2&&d[i]===1&&s===''){s+='十';}
    else{s+=((d[i]===2&&i<2)?'兩':DIG[d[i]])+units[i];}
  }
  return s;
}
function accepted(n){
  const c=cn(n),set=new Set([c]);
  if(n>=100&&!c.includes('零')&&c.length>=3){
    const last=c[c.length-1];
    if(last==='十'||last==='百'){
      const unitBefore=c[c.length-3];
      if(unitBefore==='百'||unitBefore==='千')set.add(c.slice(0,-1));
    }
  }
  return set;
}
function digitsOf(n){return String(n).length;}
function weightOf(n){return [0,1,1.5,2,3][digitsOf(n)];}
function strata(range){
  return range===999?[[0,9,.1],[10,99,.3],[100,999,.6]]:[[0,9,.1],[10,99,.2],[100,999,.3],[1000,9999,.4]];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickNumbers(N,range){
  const st=strata(range);
  const counts=st.map(s=>Math.floor(N*s[2]));
  let rest=N-counts.reduce((a,b)=>a+b,0);
  const order=st.map((s,i)=>[N*s[2]-counts[i],i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<rest;k++)counts[order[k%order.length][1]]++;
  const out=[];
  st.forEach((s,i)=>{
    const pool=[];for(let v=s[0];v<=s[1];v++)pool.push(v);
    out.push(...shuffle(pool).slice(0,counts[i]));
  });
  return shuffle(out);
}
const LIMIT={A:{1:3,2:4,3:5,4:7},B:{1:5,2:6,3:7,4:9}};
function speedBonus(mode,n,t){
  const L=LIMIT[mode][digitsOf(n)];
  return t<=L/2?10:(t<=L?5:0);
}
function comboBonus(streak){return streak>=5?10:(streak>=3?5:0);}

let voice=null,voiceFallback=null,screen='setup';
function loadVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  const norm=v=>v.lang.replace('_','-').toLowerCase();
  voice=vs.find(v=>norm(v)==='zh-tw')||null;
  voiceFallback=vs.find(v=>norm(v).startsWith('zh'))||null;
}
function voiceNote(){
  if(voice)return '';
  const k=voiceFallback?'fallback':'novoice';
  return `<div class="warn">${tr(k)}${fo(k)?'<br>'+fo(k):''}</div>`;
}
function refreshVoiceNote(){const el=document.getElementById('voiceWarn');if(el)el.innerHTML=voiceNote();}
if('speechSynthesis' in window){
  loadVoice();
  speechSynthesis.onvoiceschanged=()=>{loadVoice();if(screen==='setup')refreshVoiceNote();};
  setTimeout(()=>{loadVoice();if(screen==='setup')refreshVoiceNote();},800);
}
function speak(text,cb){
  if(!('speechSynthesis' in window)){setTimeout(cb,600);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-TW';const v=voice||voiceFallback;if(v)u.voice=v;u.rate=cfg.rate;
  let done=false;const fin=()=>{if(!done){done=true;cb&&cb();}};
  u.onend=fin;u.onerror=fin;setTimeout(fin,8000);
  setTimeout(()=>speechSynthesis.speak(u),60);
}

function stdG(){const [rows,cols]=GRIDS[cfg.grid];return {mode:cfg.mode,rows,cols,colors:SETS[cfg.set].map(id=>COLORS[id]),nums:null,range:cfg.range,hearts:5,title:''};}
function customColor(i,o){
  const r=parseInt(o.h.slice(1,3),16),g=parseInt(o.h.slice(3,5),16),b=parseInt(o.h.slice(5,7),16);
  const lum=0.299*r+0.587*g+0.114*b;
  return {id:'c'+i,zh:[o.n,o.n],q:[o.n,o.n],say:o.s||o.n,es:'',en:'',bg:o.h,fg:lum>150?'#111':'#fff'};
}
function normalizeCfg(c){
  if(!c||typeof c!=='object')return null;
  const cp=(x,n)=>[...String(x==null?'':x).trim()].slice(0,n).join('');
  const o={name:cp(c.name,20),mode:c.mode==='B'?'B':'A'};
  o.rows=Math.min(8,Math.max(3,parseInt(c.rows)||5));
  o.cols=Math.min(6,Math.max(3,parseInt(c.cols)||4));
  o.hearts=[0,3,5].includes(c.hearts)?c.hearts:5;
  if(Array.isArray(c.custom)){
    const cu=c.custom.slice(0,12).map(x=>({n:cp(x&&x.n,8),s:cp(x&&x.s,12),h:(x&&/^#[0-9a-fA-F]{6}$/.test(x.h))?x.h.toLowerCase():'#888888'}));
    if(cu.length<2||cu.some(x=>!x.n))return null;
    o.custom=cu;
  }else{
    const ids=Array.isArray(c.ids)?[...new Set(c.ids.filter(id=>COLORS[id]))]:[];
    if(ids.length<2)return null;
    o.ids=ids;
  }
  if(Array.isArray(c.nums)){
    const ns=[...new Set(c.nums.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=9999))].slice(0,200);
    if(!ns.length)return null;
    o.nums=ns;
  }else o.range=c.range===9999?9999:999;
  return o;
}
function parseNumList(text){
  const toks=String(text).split(/[\s,，、;；]+/).filter(Boolean);
  if(!toks.length)return null;
  const out=new Set();
  for(const t of toks){
    let m;
    if((m=/^(\d{1,4})$/.exec(t)))out.add(+m[1]);
    else if((m=/^(\d{1,4})\s*[-~–－～]\s*(\d{1,4})$/.exec(t))){
      const a=+m[1],b=+m[2];if(a>b)return null;
      for(let v=a;v<=b;v++){out.add(v);if(out.size>200)return null;}
    }else return null;
  }
  if(out.size>200)return null;
  return [...out];
}
function encodeCfg(c){
  const j=JSON.stringify(c);const bytes=new TextEncoder().encode(j);
  let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeCfg(t){
  try{
    let b=String(t).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const bin=atob(b);const u=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    return normalizeCfg(JSON.parse(new TextDecoder().decode(u)));
  }catch(e){return null;}
}
function toGame(c){
  const colors=c.custom?c.custom.map((o,i)=>customColor(i,o)):c.ids.map(id=>COLORS[id]);
  return {mode:c.mode,rows:c.rows,cols:c.cols,colors,nums:c.nums||null,range:c.range||999,hearts:c.hearts,title:c.name||''};
}
function pickFromList(N,list){
  const out=[];
  while(out.length<N)out.push(...shuffle(list));
  return shuffle(out.slice(0,N));
}

// ---- 遊戲 ----
let S=null,timerId=null,lastRun=null;
function buildBoard(g){
  const N=g.rows*g.cols,cl=g.colors;
  const nums=g.nums?pickFromList(N,g.nums):pickNumbers(N,g.range);
  let cs=shuffle(cl.map(c=>c.id));
  while(cs.length<N)cs.push(cl[Math.floor(Math.random()*cl.length)].id);
  cs=shuffle(cs).slice(0,N);
  return {rows:g.rows,cols:g.cols,cells:nums.map((n,i)=>({n,color:cs[i],alive:true,acc:accepted(n)}))};
}
function startGame(g,ctx,name){
  loadVoice();
  if(g)lastRun={g,ctx:ctx||'std',name:name||''};
  if(!lastRun)lastRun={g:stdG(),ctx:'std',name:''};
  const r=lastRun,G=r.g;
  const b=buildBoard(G);
  S={g:G,ctx:r.ctx,stuName:r.name,cmap:Object.fromEntries(G.colors.map(c=>[c.id,c])),mode:G.mode,rows:b.rows,cols:b.cols,cells:b.cells,score:0,hearts:G.hearts,streak:0,t0:Date.now(),qid:0,qStart:null,busy:false,input:'',wrong:0,noScore:false,cur:null,curColor:null,ended:false,qtext:'',qspeak:'',paused:false,pauseStart:0,pendingNext:false,confirmKind:null,confirmWasPaused:false};
  screen='game';
  document.getElementById('over').classList.add('hide');
  document.getElementById('confirm').classList.add('hide');
  renderGame();
  clearInterval(timerId);
  timerId=setInterval(tick,100);
  nextQ();
}

// ---- 暫停 / 確認 ----
function pauseGame(){
  if(!S||S.ended||S.paused)return;
  S.paused=true;S.pauseStart=Date.now();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  document.getElementById('cover').classList.add('show');

}
function pauseLabel(paused){return (paused?'▶ ':'⏸ ')+L(paused?'resume':'pause');}
function resumeGame(){
  if(!S||S.ended||!S.paused)return;
  S.t0+=Date.now()-S.pauseStart;   // 暫停期間不計時
  S.paused=false;
  document.getElementById('cover').classList.remove('show');
  document.getElementById('pbtn').innerHTML=pauseLabel(false);
  if(S.pendingNext){S.pendingNext=false;nextQ();}
  else{S.qStart=null;playQ();}      // 繼續後重播題目，速度加成重新計時
}

// ---- 出題 ----
function nextQ(){
  if(S.paused){S.pendingNext=true;return;}
  S.busy=false;S.input='';S.wrong=0;S.noScore=false;S.qStart=null;
  document.querySelectorAll('.cell.hint').forEach(e=>e.classList.remove('hint'));
  const alive=S.cells.map((c,i)=>c.alive?i:-1).filter(i=>i>=0);
  if(!alive.length){finish(true);return;}
  S.qid++;
  if(S.mode==='A'){
    S.cur=alive[Math.floor(Math.random()*alive.length)];
    S.qspeak=cn(S.cells[S.cur].n);
    S.qtext=numDisp(S.qspeak);
  }else{
    const cols=[...new Set(alive.map(i=>S.cells[i].color))];
    S.curColor=cols[Math.floor(Math.random()*cols.length)];
    const c=S.cmap[S.curColor];
    S.qspeak=c.say;                                  // 唸「紅色」或老師自訂的發音文字
    S.qtext=c.q[cfg.simp?1:0];                       // 顯示「紅色」
  }
  document.getElementById('qtext').textContent=cfg.showText?S.qtext:'';
  if(S.mode==='B')updateHud();
  playQ();
}
function playQ(){
  const id=S.qid;
  speak(S.qspeak,()=>{if(S&&S.qid===id&&!S.paused&&S.qStart===null)S.qStart=Date.now();});
}
function replay(){if(S&&!S.ended&&!S.busy&&!S.paused)playQ();}
function elapsedQ(){return S.qStart===null?0:(Date.now()-S.qStart)/1000;}

function award(n){
  let pts=0,parts=[];
  if(!S.noScore){
    S.streak++;
    pts+=10*weightOf(n);
    const cb=comboBonus(S.streak);if(cb){pts+=cb;parts.push(`${tr('combo')} ×${S.streak} +${cb}`);}
    const sb=speedBonus(S.mode,n,elapsedQ());if(sb){pts+=sb;parts.push(`${tr('fastTxt')} +${sb}`);}
  }
  S.score+=pts;
  toast(`+${pts}${parts.length?'\n'+parts.join('  '):''}`);
}
function correct(idx){
  S.busy=true;
  const c=S.cells[idx];
  award(c.n);
  c.alive=false;
  const el=document.getElementById('c'+idx);
  el.classList.remove('hint');el.classList.add('pop');
  setTimeout(()=>{el.classList.add('empty');},330);
  updateHud();
  setTimeout(nextQ,650);
}
function wrong(el){
  S.score=Math.max(0,S.score-5);S.streak=0;S.wrong++;
  if(S.g.hearts)S.hearts--;
  if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
  toast('−5');
  updateHud();
  if(S.g.hearts&&S.hearts<=0){S.busy=true;setTimeout(()=>finish(false),600);return false;}
  return true;
}
function answerA(id,el){
  if(!S||S.busy||S.ended||S.paused||S.mode!=='A')return;
  const cell=S.cells[S.cur];
  if(cell.color===id){correct(S.cur);}
  else{
    const alive=wrong(el);
    if(alive&&S.wrong>=3&&!S.noScore){
      S.noScore=true;
      document.getElementById('c'+S.cur).classList.add('hint');
      toast(tr('hintNote')+(fo('hintNote')?'\n'+fo('hintNote'):''));
    }
  }
}
function pressKey(k){if(!S||S.busy||S.ended||S.paused||S.mode!=='B')return;if(S.input.length<10){S.input+=k;updateHud();}}
function backspace(){if(!S||S.busy||S.ended||S.paused)return;S.input=S.input.slice(0,-1);updateHud();}
function submitB(){
  if(!S||S.busy||S.ended||S.paused||S.mode!=='B'||!S.input)return;
  const idx=S.cells.findIndex(c=>c.alive&&c.color===S.curColor&&c.acc.has(S.input));
  if(idx>=0){correct(idx);}
  else{
    const box=document.getElementById('inbox');

function downloadResult(){

  const x=cv.getContext('2d');
  const F='system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.strokeStyle='#ddd';x.lineWidth=4;x.strokeRect(14,14,W-28,H-28);
  x.textAlign='center';
  x.fillStyle='#222';x.font='bold 46px '+F;x.fillText(cfg.simp?'色数消消乐':'色數消消樂',W/2,95);
  x.fillStyle='#888';x.font='26px '+F;x.fillText('Pop Colores y Números',W/2,135);

  if(S.g.title){x.fillStyle='#555';x.font='28px '+F;x.fillText([...S.g.title].slice(0,24).join(''),W/2,275);}
  x.fillStyle='#222';x.font='bold 150px '+F;x.fillText(String(S.score),W/2,450);
  x.font='28px '+F;x.fillStyle='#777';x.fillText(tr('total'),W/2,495);
  x.fillStyle='#222';x.font='32px '+F;
  const lines=[
    `${tr('time')}：${fmt(S.finalSecs)}`,
    `${tr('lives')}：${S.g.hearts?(S.hearts+' / '+S.g.hearts):'∞'}`,
    `${S.mode==='A'?tr('A'):tr('B')} · ${S.rows}×${S.cols}`,
    S.clearedFlag?tr('cleared'):tr('over')
  ];
  lines.forEach((t,i)=>x.fillText(t,W/2,580+i*56));
  x.fillStyle='#999';x.font='24px '+F;x.fillText(new Date().toLocaleString(),W/2,H-50);
  cv.toBlob(b=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='pop-colores-score.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },'image/png');
}

  if(!list.length)return `<p>${L('empty')}</p>`;
  return '<table class="lb">'+list.map((e,i)=>`<tr class="${e.uid===myUid?'me':''}"><td>${i+1}</td><td>${esc(e.name)}</td><td>${e.score}</td><td>${fmt(e.secs)}</td></tr>`).join('')+'</table>';

async function lbAfterGame(){
  const area=document.getElementById('lbArea');
  if(!area||!S)return;
  const board=boardId(S.mode);
  area.innerHTML=`<p>${L('loading')}</p>`;
  if(!window.LB){area.innerHTML=`<p>${L('lbError')}</p>`;return;}
  try{
    const res=await window.LB.top(board);
    const list=res.list;
    const rank=S.score*100000+(99999-S.finalSecs);
    const me=list.find(e=>e.uid===res.uid);
    const tenth=list.length>=10?list[9].rank:-1;
    S.lb={board,rank};
    if(S.score<=0){area.innerHTML=`<p>${L('notTop')}</p>`+lbTable(list,res.uid);return;}
    if(me&&me.rank>=rank){area.innerHTML=`<p>${L('notBetter')}</p>`+lbTable(list,res.uid);return;}
    const qualifies=list.length<10||rank>tenth||(me&&rank>me.rank);
    if(!qualifies){area.innerHTML=`<p>${L('notTop')}</p>`+lbTable(list,res.uid);return;}
    let last='';try{last=localStorage.getItem('shushu_nick')||'';}catch(e){}
    area.innerHTML=`<p><b>${L('qualify')}</b></p>
      <input id="nick" class="nick" placeholder="${esc(tr('nickname'))}" value="${esc(last)}" oninput="clampNick(this)">
      <button class="big" id="upBtn" onclick="uploadScore()">${L('upload')}</button>`+lbTable(list,res.uid);
  }catch(e){console.error(e);area.innerHTML=`<p>${L('lbError')}</p>`;}
}

function edToCfg(){
  const E=ED;
  const raw={name:E.name,mode:E.mode,rows:E.rows,cols:E.cols,hearts:E.hearts};
  if(E.cmode==='custom')raw.custom=E.custom;else raw.ids=E.ids;
  if(E.nmode==='list'){const l=parseNumList(E.list);if(!l)return {err:tr('numHint')};raw.nums=l;}
  else raw.range=E.nmode==='9999'?9999:999;
  if(E.cmode==='custom'&&E.custom.some(c=>!c.n.trim()))return {err:tr('colorName')+'?'};
  const c=normalizeCfg(raw);
  if(!c)return {err:tr('bad')};
  return {cfg:c};
}

  const r=edToCfg();

  try{await window.TA.saveConfigs(items);TS.items=items;ED.name=c.name;ED.err='';toast(tr('saved2'));}

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getFirestore,collection,query,orderBy,limit,getDocs,getDoc,doc,setDoc,updateDoc,serverTimestamp,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={
  apiKey:"AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60",
  authDomain:"memorma-24dab.firebaseapp.com",
  projectId:"memorma-24dab",
  storageBucket:"memorma-24dab.firebasestorage.app",
  messagingSenderId:"806709458465",
  appId:"1:806709458465:web:f0d12acb2f911f2f165560",
  measurementId:"G-RS1DJ7DH50"
};
const ADMIN_EMAIL='a2224907@gmail.com';
try{
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  const db=getFirestore(app);
  async function ensureUid(){
    await auth.authStateReady();
    if(auth.currentUser)return auth.currentUser.uid;
    const c=await signInAnonymously(auth);
    return c.user.uid;
  }
  window.LB={
    async top(board){
      const uid=await ensureUid();
      const q=query(collection(db,'colorgame_boards',board,'entries'),orderBy('rank','desc'),limit(10));
      const snap=await getDocs(q);
      return {uid,list:snap.docs.map(d=>({uid:d.id,...d.data()}))};
    },
    async submit(board,e){
      const uid=await ensureUid();
      const rank=e.score*100000+(99999-e.secs);
      await setDoc(doc(db,'colorgame_boards',board,'entries',uid),{
        name:e.name,score:e.score,secs:e.secs,hearts:e.hearts,cleared:e.cleared,rank,updatedAt:serverTimestamp()
      });
    }
  };
  const real=u=>u&&!u.isAnonymous;
  const ms=t=>t&&t.toMillis?t.toMillis():null;
  window.TA={
    ready(){return auth.authStateReady();},
    user(){const u=auth.currentUser;return real(u)?{uid:u.uid,email:u.email||'',name:u.displayName||''}:null;},
    isAdmin(){const u=auth.currentUser;return !!(real(u)&&u.email===ADMIN_EMAIL&&u.emailVerified);},
    async login(){await signInWithPopup(auth,new GoogleAuthProvider());},
    async logout(){await signOut(auth);},
    async profile(){
      const u=auth.currentUser,ref=doc(db,'teachers',u.uid);
      let s=await getDoc(ref);
      if(!s.exists()){
        await setDoc(ref,{email:u.email||'',name:u.displayName||'',plan:'free',expiresAt:null,createdAt:serverTimestamp()});
        s=await getDoc(ref);
      }
      const d=s.data();
      return {plan:d.plan,expiresAt:ms(d.expiresAt),email:d.email,name:d.name};
    },
    async configs(){
      const u=auth.currentUser,s=await getDoc(doc(db,'teacher_configs',u.uid));
      return s.exists()?(s.data().items||[]):[];
    },
    async saveConfigs(items){
      const u=auth.currentUser;
      await setDoc(doc(db,'teacher_configs',u.uid),{items,updatedAt:serverTimestamp()});
    },
    async listTeachers(){
      const s=await getDocs(collection(db,'teachers'));
      return s.docs.map(d=>{const x=d.data();return {uid:d.id,email:x.email,name:x.name,plan:x.plan,expiresAt:ms(x.expiresAt)};});
    },
    async setPlan(uid,plan,expMs){
      await updateDoc(doc(db,'teachers',uid),{plan,expiresAt:expMs?Timestamp.fromMillis(expMs):null});
    }
  };
  onAuthStateChanged(auth,()=>{if(window.onTAChange)window.onTAChange();});
}catch(err){console.error('Firebase init failed',err);}
</script>
