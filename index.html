<script>
// ==CORE==
const DIG=['零','一','二','三','四','五','六','七','八','九'];
function cn(n){
  if(n===0)return '零';
  const d=[Math.floor(n/1000)%10,Math.floor(n/100)%10,Math.floor(n/10)%10,n%10];
  const units=['千','百','十',''];
  let s='',zero=false;
  for(let i=0;i<4;i++){
    if(d[i]===0){if(s)zero=true;continue;}
    if(zero){s+='零';zero=false;}
    if(i===2&&d[i]===1&&s===''){s+='十';}
    else{s+=((d[i]===2&&i<2)?'兩':DIG[d[i]])+units[i];}
  }
  return s;
}
function accepted(n){
  const c=cn(n),set=new Set([c]);
  if(n>=100&&!c.includes('零')&&c.length>=3){
    const last=c[c.length-1];
    if(last==='十'||last==='百'){
      const unitBefore=c[c.length-3];
      if(unitBefore==='百'||unitBefore==='千')set.add(c.slice(0,-1));
    }
  }
  return set;
}
function digitsOf(n){return String(n).length;}
function weightOf(n){return [0,1,1.5,2,3][digitsOf(n)];}
function strata(range){
  return range===999?[[0,9,.1],[10,99,.3],[100,999,.6]]:[[0,9,.1],[10,99,.2],[100,999,.3],[1000,9999,.4]];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickNumbers(N,range){
  const st=strata(range);
  const counts=st.map(s=>Math.floor(N*s[2]));
  let rest=N-counts.reduce((a,b)=>a+b,0);
  const order=st.map((s,i)=>[N*s[2]-counts[i],i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<rest;k++)counts[order[k%order.length][1]]++;
  const out=[];
  st.forEach((s,i)=>{
    const pool=[];for(let v=s[0];v<=s[1];v++)pool.push(v);
    out.push(...shuffle(pool).slice(0,counts[i]));
  });
  return shuffle(out);
}
const LIMIT={A:{1:3,2:4,3:5,4:7},B:{1:5,2:6,3:7,4:9}};
function speedBonus(mode,n,t){
  const L=LIMIT[mode][digitsOf(n)];
  return t<=L/2?10:(t<=L?5:0);
}
function comboBonus(streak){return streak>=5?10:(streak>=3?5:0);}

// ===== 三款遊戲共用的基本設定（⚙️）：localStorage 'hanziGames.settings'，格式見 corre/README.md =====
//   { v:1, script:'trad'|'simp', lang:'es'|'en'|'zh', phon:'pinyin'|'zhuyin'|'both'|'off', rate:'slow'|'normal'|'fast' }
const SETTINGS_KEY='hanziGames.settings';
const SET_OPTS={script:['trad','simp'],lang:['es','en','zh'],phon:['pinyin','zhuyin','both','off'],rate:['slow','normal','fast']};
const RATE_VALUE={slow:0.45,normal:0.65,fast:0.85};   // 和小狗找寶藏、跑吧等所有遊戲同一組語速
function readSettings(){
  const out={v:1,script:'trad',lang:'es',phon:'pinyin',rate:'normal'};
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');}catch(e){}
  if(saved&&typeof saved==='object'){
    Object.keys(SET_OPTS).forEach(k=>{if(SET_OPTS[k].includes(saved[k]))out[k]=saved[k];});
  }else{
    // 第一次：從色數舊的設定搬過來（simp、aux：es/en/none、rate：0.55/0.85/1.1）
    if(oldCfg.simp===true)out.script='simp';
    if(oldCfg.aux==='en')out.lang='en';else if(oldCfg.aux==='none')out.lang='zh';
    if(typeof oldCfg.rate==='number')out.rate=oldCfg.rate<0.7?'slow':(oldCfg.rate>1?'fast':'normal');
    writeSettings(out);
  }
  return out;
}
function writeSettings(o){
  try{
    let cur={};try{cur=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')||{};}catch(e){}
    localStorage.setItem(SETTINGS_KEY,JSON.stringify(Object.assign(cur,{v:1,script:o.script,lang:o.lang,phon:o.phon,rate:o.rate})));
  }catch(e){}
}
const SETTINGS=readSettings();
// 舊程式用的 cfg.simp／cfg.aux／cfg.rate 由共用設定算出來
function syncFromSettings(){
  cfg.simp=SETTINGS.script==='simp';
  cfg.aux=SETTINGS.lang==='zh'?'none':SETTINGS.lang;
  cfg.rate=RATE_VALUE[SETTINGS.rate]||0.65;
}

// ===== 拼音／注音（台灣讀音）：顏色與數字用到的字 =====
const PY={'零':'líng','一':'yī','二':'èr','兩':'liǎng','两':'liǎng','三':'sān','四':'sì','五':'wǔ','六':'liù','七':'qī','八':'bā','九':'jiǔ','十':'shí','百':'bǎi','千':'qiān',
 '紅':'hóng','红':'hóng','黃':'huáng','黄':'huáng','藍':'lán','蓝':'lán','綠':'lǜ','绿':'lǜ','黑':'hēi','白':'bái','灰':'huī','橘':'jú','紫':'zǐ','粉':'fěn',
 '咖':'kā','啡':'fēi','深':'shēn','淺':'qiǎn','浅':'qiǎn','色':'sè'};
// 一串字 → 拼音（每字一個音節，空白分開）；有不認得的字就回傳空字串
function pyOf(text){
  const cs=[...String(text)];
  const out=cs.map((c,i)=>{
    if(c==='一'&&i<cs.length-1&&/[十百千]/.test(cs[i+1]))return 'yì';   // 一百、一千、一十：變調唸 yì
    return PY[c];
  });
  return out.every(Boolean)?out.join(' '):'';
}
/* 拼音（帶聲調符號）→ 注音（與跑吧！漢字同一份轉換器） */
const ZY=(function(){
  var INI={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
  var FIN={a:'ㄚ',o:'ㄛ',e:'ㄜ',ê:'ㄝ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',
    i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',
    u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ong:'ㄨㄥ',ueng:'ㄨㄥ',
    v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ',iong:'ㄩㄥ'};
  var MARK=['','','ˊ','ˇ','ˋ'];
  function one(syl){
    var s=syl.normalize('NFD'),tone=5;
    if(/̄/.test(s))tone=1;else if(/́/.test(s))tone=2;else if(/̌/.test(s))tone=3;else if(/̀/.test(s))tone=4;
    s=s.replace(/ü/g,'v').replace(/ü/g,'v').replace(/Ü/g,'v').replace(/[̀-ͯ]/g,'').toLowerCase();
    if(!/^[a-zê]+$/.test(s))return syl;
    var ini='',rest=s,m;
    if(s==='n'||s==='m'){var zz=s==='n'?'ㄣ':'ㄇㄨ';return tone===5?'˙'+zz:zz+MARK[tone];}
    if(s==='er'||s==='r'){rest='er';}
    else if((m=s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/))){ini=m[1];rest=s.slice(ini.length);}
    else if(s[0]==='y'){rest=s.slice(1);if(/^u/.test(rest))rest=rest.replace(/^u/,'v');else if(!(rest==='i'||rest==='in'||rest==='ing'))rest='i'+rest;}
    else if(s[0]==='w'){rest=s.slice(1);rest=(rest==='u')?'u':'u'+rest;}
    if(ini&&/^[jqx]$/.test(ini))rest=rest.replace(/^u/,'v');
    if(/^(zh|ch|sh|r|z|c|s)$/.test(ini)&&rest==='i')rest='';
    var f=rest===''?'':FIN[rest];
    if(f===undefined)return syl;
    var z=(ini?INI[ini]:'')+f;
    return tone===5?'˙'+z:z+MARK[tone];
  }
  function conv(py){return String(py||'').trim().split(/\s+/).filter(Boolean).map(one).join(' ');}
  return {one:one,conv:conv};
})();
// 依 ⚙️ 的拼音／注音設定，產生放在字「上面」的小字（off 或沒有拼音時回傳空字串）
function phHtml(py){
  if(!py||SETTINGS.phon==='off')return '';
  const k=SETTINGS.phon;
  if(k==='pinyin')return `<span class="ph">${esc(py)}</span>`;
  if(k==='zhuyin')return `<span class="ph zy">${esc(ZY.conv(py))}</span>`;
  return `<span class="ph">${esc(py)}</span><span class="ph zy">${esc(ZY.conv(py))}</span>`;
}

// ---- 語音 ----
let voice=null,voiceFallback=null,screen='setup';
function loadVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  const norm=v=>v.lang.replace('_','-').toLowerCase();
  voice=vs.find(v=>norm(v)==='zh-tw')||null;
  voiceFallback=vs.find(v=>norm(v).startsWith('zh')&&!/^(yue|zh-hk)/.test(norm(v)))||null;   // 排除廣東話
}
function voiceNote(){
  if(voice)return '';
  const k=voiceFallback?'fallback':'novoice';
  return `<div class="warn">${tr(k)}${fo(k)?'<br>'+fo(k):''}</div>`;
}
function refreshVoiceNote(){const el=document.getElementById('voiceWarn');if(el)el.innerHTML=voiceNote();}
if('speechSynthesis' in window){
  loadVoice();
  speechSynthesis.onvoiceschanged=()=>{loadVoice();refreshVoiceNote();};
  setTimeout(()=>{loadVoice();refreshVoiceNote();},800);
  setTimeout(()=>{loadVoice();refreshVoiceNote();},2500);
}
function speak(text,cb){
  if(!('speechSynthesis' in window)){setTimeout(cb,600);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-TW';const v=voice||voiceFallback;if(v)u.voice=v;u.rate=cfg.rate;
  let done=false;const fin=()=>{if(!done){done=true;cb&&cb();}};
  u.onend=fin;u.onerror=fin;setTimeout(fin,8000);
  setTimeout(()=>speechSynthesis.speak(u),60);
}

function stdG(){const [rows,cols]=GRIDS[cfg.grid];return {mode:cfg.mode,rows,cols,colors:SETS[cfg.set].map(id=>COLORS[id]),nums:null,range:cfg.range,hearts:5,title:''};}
function customColor(i,o){
  const r=parseInt(o.h.slice(1,3),16),g=parseInt(o.h.slice(3,5),16),b=parseInt(o.h.slice(5,7),16);
  const lum=0.299*r+0.587*g+0.114*b;
  return {id:'c'+i,zh:[o.n,o.n],q:[o.n,o.n],say:o.s||o.n,p:o.p||'',es:'',en:'',bg:o.h,fg:lum>150?'#111':'#fff'};
}
function normalizeCfg(c){
  if(!c||typeof c!=='object')return null;
  const cp=(x,n)=>[...String(x==null?'':x).trim()].slice(0,n).join('');
  const o={name:cp(c.name,20),mode:c.mode==='B'?'B':'A'};
  o.rows=Math.min(8,Math.max(3,parseInt(c.rows)||5));
  o.cols=Math.min(6,Math.max(3,parseInt(c.cols)||4));
  o.hearts=[0,3,5].includes(c.hearts)?c.hearts:5;
  // 自訂顏色：n 名稱、s 發音文字、h 顏色、p 拼音（選填；老師在中心編輯時自動帶出，可手改）
  const cu=Array.isArray(c.custom)?c.custom.slice(0,12).map(x=>{const o={n:cp(x&&x.n,8),s:cp(x&&x.s,12),h:(x&&/^#[0-9a-fA-F]{6}$/.test(x.h))?x.h.toLowerCase():'#888888'};const py=cp(x&&x.p,40);if(py)o.p=py;return o;}):[];
  if(cu.some(x=>!x.n))return null;
  const ids=Array.isArray(c.ids)?[...new Set(c.ids.filter(id=>COLORS[id]))]:[];
  if(ids.length+cu.length<2)return null;
  if(ids.length)o.ids=ids;
  if(cu.length)o.custom=cu;
  if(Array.isArray(c.nums)){
    const ns=[...new Set(c.nums.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=9999))].slice(0,200);
    if(!ns.length)return null;
    o.nums=ns;
  }else o.range=c.range===9999?9999:999;
  return o;
}
function parseNumList(text){
  const toks=String(text).split(/[\s,，、;；]+/).filter(Boolean);
  if(!toks.length)return null;
  const out=new Set();
  for(const t of toks){
    let m;
    if((m=/^(\d{1,4})$/.exec(t)))out.add(+m[1]);
    else if((m=/^(\d{1,4})\s*[-~–－～]\s*(\d{1,4})$/.exec(t))){
      const a=+m[1],b=+m[2];if(a>b)return null;
      for(let v=a;v<=b;v++){out.add(v);if(out.size>200)return null;}
    }else return null;
  }
  if(out.size>200)return null;
  return [...out];
}
function encodeCfg(c){
  const j=JSON.stringify(c);const bytes=new TextEncoder().encode(j);
  let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeCfg(t){
  try{
    let b=String(t).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const bin=atob(b);const u=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    const c=normalizeCfg(JSON.parse(new TextDecoder().decode(u)));
    if(!c||c.custom||c.nums)return null;   // 舊式網址只允許免費功能，進階設定一律要走 ID 連結
    return c;
  }catch(e){return null;}
}
function toGame(c){
  const colors=[...(c.ids||[]).map(id=>COLORS[id]),...(c.custom||[]).map((o,i)=>customColor(i,o))];
  return {mode:c.mode,rows:c.rows,cols:c.cols,colors,nums:c.nums||null,range:c.range||999,hearts:c.hearts,title:c.name||''};
}
function pickFromList(N,list){
  const out=[];
  while(out.length<N)out.push(...shuffle(list));
  return shuffle(out.slice(0,N));
}

// ---- 遊戲 ----
let S=null,timerId=null,lastRun=null;
function buildBoard(g){
  const N=g.rows*g.cols,cl=g.colors;
  const nums=g.nums?pickFromList(N,g.nums):pickNumbers(N,g.range);
  let cs=shuffle(cl.map(c=>c.id));
  while(cs.length<N)cs.push(cl[Math.floor(Math.random()*cl.length)].id);
  cs=shuffle(cs).slice(0,N);
  return {rows:g.rows,cols:g.cols,cells:nums.map((n,i)=>({n,color:cs[i],alive:true,acc:accepted(n)}))};
}
let CLASSID='',CLASS=null,SETKEY='link';   // SETKEY：成績依「用了哪個設定組」分開記（?c=設定碼；舊式 ?t= 連結＝link）   // 班級模式：成績自動回傳給老師（?class=班級碼）
function startLink(){
  if(CLASS&&!String(stuName||'').trim()){toast(tr('classNeed'));return;}
  startGame(toGame(LINKCFG),'link',stuName);
}
async function prepClass(){
  if(!CLASSID)return true;
  try{
    for(let i=0;i<100&&!window.TA;i++)await new Promise(r=>setTimeout(r,100));
    if(!window.TA)throw {code:'unavailable'};
    CLASS=await window.TA.classGet(CLASSID);
    if(!CLASS){linkMsg('linkGone');return false;}
    return true;
  }catch(e){console.error(e);linkMsg('lbError');return false;}
}
async function sendClassResult(){
  const el=document.getElementById('classArea');if(!el||!CLASS||!S)return;
  const nick=[...String(S.stuName||'').trim()].slice(0,16).join('');
  el.innerHTML=`<p class="note">${L('classSending')}</p>`;
  try{
    await window.TA.classSubmit(CLASSID,CLASS.owner,{k:SETKEY,nick,score:Math.max(0,Math.min(1000000,S.score|0)),extra:{secs:S.finalSecs,cleared:S.clearedFlag?1:0}});
    el.innerHTML=`<p class="note">${L('classSent')}</p>`;
    if(CLASS.showBoard){
      const rows=await window.TA.classBoard(CLASSID,SETKEY);
      el.innerHTML+=`<h3>${L('classBoard')}</h3><table>${rows.map((r,i)=>`<tr><td>${i+1}. ${esc(r.nick)}</td><td>${r.best}</td></tr>`).join('')}</table>`;
    }
  }catch(e){
    console.error(e);
    el.innerHTML=`<p class="err">${L('classFail')}</p><button class="big sec" onclick="sendClassResult()">${L('classRetry')}</button>`;
  }
}
function startGame(g,ctx,name){
  loadVoice();
  if(g)lastRun={g,ctx:ctx||'std',name:name||''};
  if(!lastRun)lastRun={g:stdG(),ctx:'std',name:''};
  const r=lastRun,G=r.g;
  const b=buildBoard(G);
  S={g:G,ctx:r.ctx,stuName:r.name,cmap:Object.fromEntries(G.colors.map(c=>[c.id,c])),mode:G.mode,rows:b.rows,cols:b.cols,cells:b.cells,score:0,hearts:G.hearts,streak:0,t0:Date.now(),qid:0,qStart:null,busy:false,input:'',wrong:0,noScore:false,cur:null,curColor:null,ended:false,qtext:'',qspeak:'',paused:false,pauseStart:0,pendingNext:false,confirmKind:null,confirmWasPaused:false};
  screen='game';
  document.getElementById('over').classList.add('hide');
  document.getElementById('confirm').classList.add('hide');
  renderGame();
  clearInterval(timerId);
  timerId=setInterval(tick,100);
  try{ window.HGPlays && HGPlays.start(S.ctx+':'+G.mode+'_'+b.rows+'x'+b.cols, S.stuName); }catch(e){}
  nextQ();
}
function restartGame(){startGame();}
function leaveGame(){
  clearInterval(timerId);
  document.getElementById('over').classList.add('hide');
  document.getElementById('confirm').classList.add('hide');
  if('speechSynthesis' in window)speechSynthesis.cancel();
  const ctx=S?S.ctx:'std';
  S=null;
  if(ctx==='link')renderLinkStart(LINKCFG);
  else renderSetup();
}
function cLabel(c){return c.zh[cfg.simp?1:0];}
function cAux(c){return cfg.aux==='none'?'':(c[cfg.aux]||'');}
function renderGame(){
  const cl=S.g.colors,n=cl.length;
  const cols=n<=3?n:(n===4?2:(n<=9?3:4));
  const controls=S.mode==='A'
   ?`<div id="tray"><div class="trayTitle">${L('pickColor')}</div>
      <div id="colorBtns" style="grid-template-columns:repeat(${cols},1fr)">${cl.map(c=>`<div class="cbtn" style="background:${c.bg};color:${c.fg}" onclick="answerA('${c.id}',this)">${phHtml(cPy(c))}<span class="zh">${esc(cLabel(c))}</span>${cAux(c)?`<small>${cAux(c)}</small>`:''}</div>`).join('')}</div></div>`
   :`<div id="tray"><div id="inbox"></div><div id="keys">${KEYS.map(k=>`<div class="key" onclick="pressKey('${k[0]}')">${phHtml(PY[k[0]])}<span class="zh">${k[cfg.simp?1:0]}</span>${auxKey(k)?`<small>${auxKey(k)}</small>`:''}</div>`).join('')}
      <div class="key fn" onclick="backspace()">⌫ ${L('back')}</div>
      <div class="key ok" onclick="submitB()">${tr('confirm')}${fo('confirm')?`<small>${fo('confirm')}</small>`:''}</div></div></div>`;
  app.innerHTML=`
  <div id="hud">
    <div><small>${lab('score')}</small><span id="sc">0</span></div>
    <div><small>${lab('time')}</small><span id="tm">0:00</span></div>
    <div><small>${lab('lives')}</small><span id="hearts"></span></div>
    ${gearBtn().replace('class="gear"','class="gear inhud"')}
  </div>
  <div id="ctl">
    <button id="pbtn" onclick="togglePause()">${pauseLabel(false)}</button>
    <button onclick="askConfirm('restart')">↻ ${L('restart')}</button>
    <button onclick="askConfirm('menu')">⌂ ${L('menu')}</button>
  </div>
  <div id="qbar"><button onclick="replay()">🔊 ${L('replay')}</button><span id="qtext"></span></div>
  <div id="boardWrap">
    <div id="board" style="grid-template-columns:repeat(${S.cols},1fr)">
      ${S.cells.map((c,i)=>{const col=S.cmap[c.color];return `<div class="cell${c.alive?'':' empty'}" id="c${i}" style="background:${col.bg};color:${col.fg}">${c.n}</div>`;}).join('')}
    </div>
    <div id="cover"><div>${L('paused')}</div><button onclick="togglePause()">▶ ${L('resume')}</button></div>
  </div>
  ${controls}`;
  sizeBoard();updateHud();showQText();
  if(S.mode==='A'&&S.noScore&&S.cur!=null){const h=document.getElementById('c'+S.cur);if(h)h.classList.add('hint');}
  window.onresize=sizeBoard;
}
// 題目文字（開啟「顯示題目文字」時）：上面拼音／注音，下面中文
function showQText(){
  const el=document.getElementById('qtext');if(!el||!S)return;
  if(!cfg.showText||!S.qtext){el.innerHTML='';return;}
  el.innerHTML=`${phHtml(S.qpy)}<span class="zh">${esc(S.qtext)}</span>`;
}
function cPy(c){return c.p||pyOf(c.zh[0]);}   // 按鈕上的字（紅、深藍…）的拼音；自訂顏色用老師的 p
function sizeBoard(){const b=document.getElementById('board');if(!b||!S)return;b.style.setProperty('--cw',(b.clientWidth/S.cols)+'px');}
function heartsTxt(){return S.g.hearts?('♥'.repeat(S.hearts)+'♡'.repeat(Math.max(0,S.g.hearts-S.hearts))):'∞';}
function updateHud(){
  document.getElementById('sc').textContent=S.score;
  document.getElementById('hearts').textContent=heartsTxt();
  if(S.mode==='B'){document.getElementById('inbox').textContent=numDisp(S.input);}
}
function tick(){
  if(!S||S.ended||S.paused)return;
  const s=Math.floor((Date.now()-S.t0)/1000);
  const el=document.getElementById('tm');if(el)el.textContent=fmt(s);
}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1100);}

// ---- 暫停 / 確認 ----
function pauseGame(){
  if(!S||S.ended||S.paused)return;
  S.paused=true;S.pauseStart=Date.now();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  document.getElementById('cover').classList.add('show');
  document.getElementById('pbtn').innerHTML=pauseLabel(true);
}
function pauseLabel(paused){return (paused?'▶ ':'⏸ ')+L(paused?'resume':'pause');}
function resumeGame(){
  if(!S||S.ended||!S.paused)return;
  S.t0+=Date.now()-S.pauseStart;   // 暫停期間不計時
  S.paused=false;
  document.getElementById('cover').classList.remove('show');
  document.getElementById('pbtn').innerHTML=pauseLabel(false);
  if(S.pendingNext){S.pendingNext=false;nextQ();}
  else{S.qStart=null;playQ();}      // 繼續後重播題目，速度加成重新計時
}
function togglePause(){if(!S||S.ended)return;S.paused?resumeGame():pauseGame();}
function askConfirm(kind){
  if(!S||S.ended){kind==='menu'?leaveGame():restartGame();return;}
  S.confirmWasPaused=S.paused;S.confirmKind=kind;
  pauseGame();
  document.getElementById('confirmText').innerHTML=L(kind==='menu'?'confirmMenu':'confirmRestart');
  document.getElementById('cNo').innerHTML=L('cancel');
  document.getElementById('cYes').innerHTML=L('yes');
  document.getElementById('confirm').classList.remove('hide');
}
function confirmYes(){
  document.getElementById('confirm').classList.add('hide');
  const k=S&&S.confirmKind;
  if(k==='menu')leaveGame();else restartGame();
}
function confirmNo(){
  document.getElementById('confirm').classList.add('hide');
  if(S&&!S.confirmWasPaused)resumeGame();
}

// ---- 出題 ----
function nextQ(){
  if(S.paused){S.pendingNext=true;return;}
  S.busy=false;S.input='';S.wrong=0;S.noScore=false;S.qStart=null;
  document.querySelectorAll('.cell.hint').forEach(e=>e.classList.remove('hint'));
  const alive=S.cells.map((c,i)=>c.alive?i:-1).filter(i=>i>=0);
  if(!alive.length){finish(true);return;}
  S.qid++;
  if(S.mode==='A'){
    S.cur=alive[Math.floor(Math.random()*alive.length)];
    S.qspeak=cn(S.cells[S.cur].n);
    S.qtext=numDisp(S.qspeak);
    S.qpy=pyOf(S.qspeak);
  }else{
    const cols=[...new Set(alive.map(i=>S.cells[i].color))];
    S.curColor=cols[Math.floor(Math.random()*cols.length)];
    const c=S.cmap[S.curColor];
    S.qspeak=c.say;                                  // 唸「紅色」或老師自訂的發音文字
    S.qtext=c.q[cfg.simp?1:0];                       // 顯示「紅色」
    S.qpy=c.p?c.p:pyOf(c.q[0]);
  }
  showQText();
  if(S.mode==='B')updateHud();
  playQ();
}
function playQ(){
  const id=S.qid;
  speak(S.qspeak,()=>{if(S&&S.qid===id&&!S.paused&&S.qStart===null)S.qStart=Date.now();});
}
function replay(){if(S&&!S.ended&&!S.busy&&!S.paused)playQ();}
function elapsedQ(){return S.qStart===null?0:(Date.now()-S.qStart)/1000;}

function award(n){
  let pts=0,parts=[];
  if(!S.noScore){
    S.streak++;
    pts+=10*weightOf(n);
    const cb=comboBonus(S.streak);if(cb){pts+=cb;parts.push(`${tr('combo')} ×${S.streak} +${cb}`);}
    const sb=speedBonus(S.mode,n,elapsedQ());if(sb){pts+=sb;parts.push(`${tr('fastTxt')} +${sb}`);}
  }
  S.score+=pts;
  toast(`+${pts}${parts.length?'\n'+parts.join('  '):''}`);
}
function correct(idx){
  S.busy=true;
  const c=S.cells[idx];
  award(c.n);
  c.alive=false;
  const el=document.getElementById('c'+idx);
  el.classList.remove('hint');el.classList.add('pop');
  setTimeout(()=>{el.classList.add('empty');},330);
  updateHud();
  setTimeout(nextQ,650);
}
function wrong(el){
  S.score=Math.max(0,S.score-5);S.streak=0;S.wrong++;
  if(S.g.hearts)S.hearts--;
  if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
  toast('−5');
  updateHud();
  if(S.g.hearts&&S.hearts<=0){S.busy=true;setTimeout(()=>finish(false),600);return false;}
  return true;
}
function answerA(id,el){
  if(!S||S.busy||S.ended||S.paused||S.mode!=='A')return;
  const cell=S.cells[S.cur];
  if(cell.color===id){correct(S.cur);}
  else{
    const alive=wrong(el);
    if(alive&&S.wrong>=3&&!S.noScore){
      S.noScore=true;
      document.getElementById('c'+S.cur).classList.add('hint');
      toast(tr('hintNote')+(fo('hintNote')?'\n'+fo('hintNote'):''));
    }
  }
}
function pressKey(k){if(!S||S.busy||S.ended||S.paused||S.mode!=='B')return;if(S.input.length<10){S.input+=k;updateHud();}}
function backspace(){if(!S||S.busy||S.ended||S.paused)return;S.input=S.input.slice(0,-1);updateHud();}
function submitB(){
  if(!S||S.busy||S.ended||S.paused||S.mode!=='B'||!S.input)return;
  const idx=S.cells.findIndex(c=>c.alive&&c.color===S.curColor&&c.acc.has(S.input));
  if(idx>=0){correct(idx);}
  else{
    const box=document.getElementById('inbox');
    wrong(box);S.input='';updateHud();
  }
}
function finish(cleared){
  if(S.paused){S.t0+=Date.now()-S.pauseStart;S.paused=false;}
  S.ended=true;clearInterval(timerId);
  let clearB=0,heartB=0;
  if(cleared){clearB=50;heartB=S.g.hearts?20*S.hearts:0;S.score+=clearB+heartB;}
  const secs=Math.floor((Date.now()-S.t0)/1000);
  S.finalSecs=Math.min(99999,secs);S.clearedFlag=!!cleared;
  try{ window.HGPlays && HGPlays.end({score: S.score, secs: secs, name: S.stuName}); }catch(e){}
  const std=S.ctx==='std';
  const cm=!std&&S.ctx==='link'&&!!CLASS;
  // 結果畫面順序（三款統一）：分數 → 評語 → 成績已回傳給老師（班級連結）→ 排行榜／下載 → 再玩一次 → 主選單
  const extra=std?'<div id="lbArea"></div>'
   :cm?`<div id="classArea"></div><button class="big sec" onclick="downloadResult()">⬇ ${L('download')}</button>`
   :`<p class="note">${L('noRecord')}</p>
     <input id="stuNote" class="nick" placeholder="${esc(tr('noteTitle'))}" value="${esc(S.stuName||'')}" maxlength="30">
     <button class="big sec" onclick="downloadResult()">⬇ ${L('download')}</button>`;
  const o=document.getElementById('over');
  o.innerHTML=`<div class="card">
    <h1>${cleared?L('cleared'):L('over')}</h1>
    <div>${L('total')}</div><div class="total">${S.score}</div>
    <table>
      ${cleared?`<tr><td>${lab('clearBonus')}</td><td>+${clearB}</td></tr>${S.g.hearts?`<tr><td>${lab('heartBonus')}</td><td>+${heartB}</td></tr>`:''}`:''}
      <tr><td>${lab('time')}</td><td>${fmt(secs)}</td></tr>
      <tr><td>${lab('lives')}</td><td>${S.g.hearts?('♥'.repeat(S.hearts)||'0'):'∞'}</td></tr>
    </table>
    <div class="comment" id="commentLine">${L(commentKey(cleared))}</div>
    ${extra}
    <button class="big" onclick="startGame()">${L('again')}</button>
    <button class="big sec" onclick="leaveGame()">${L('menu')}</button>
  </div>`;
  o.classList.remove('hide');
  if(std)lbAfterGame();
  if(cm)sendClassResult();
}
function toSetup(){leaveGame();}
// 評語：清掉幾成（全清且愛心沒少 → 完美）
function commentKey(cleared){
  const tot=S.cells.length,done=S.cells.filter(c=>!c.alive).length,r=tot?done/tot:0;
  if(cleared||r>=1)return (S.g.hearts&&S.hearts>=S.g.hearts)?'k4':'k3';
  return r<0.25?'k0':(r<0.5?'k1':'k2');
}
function downloadResult(){
  if(!S)return;
  const nm=[...((document.getElementById('stuNote')||{value:S.stuName||''}).value||'').trim()].slice(0,30).join('');
  S.stuName=nm;
  const W=720,H=900,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  const F='system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.strokeStyle='#ddd';x.lineWidth=4;x.strokeRect(14,14,W-28,H-28);
  x.textAlign='center';
  x.fillStyle='#222';x.font='bold 46px '+F;x.fillText(cfg.simp?'色数消消乐':'色數消消樂',W/2,95);
  x.fillStyle='#888';x.font='26px '+F;x.fillText('Pop Colores y Números',W/2,135);
  x.fillStyle='#222';x.font='bold 40px '+F;x.fillText(nm||'—',W/2,225);
  if(S.g.title){x.fillStyle='#555';x.font='28px '+F;x.fillText([...S.g.title].slice(0,24).join(''),W/2,275);}
  x.fillStyle='#222';x.font='bold 150px '+F;x.fillText(String(S.score),W/2,450);
  x.font='28px '+F;x.fillStyle='#777';x.fillText(tr('total'),W/2,495);
  x.fillStyle='#222';x.font='32px '+F;
  const lines=[
    `${tr('time')}：${fmt(S.finalSecs)}`,
    `${tr('lives')}：${S.g.hearts?(S.hearts+' / '+S.g.hearts):'∞'}`,
    `${S.mode==='A'?tr('A'):tr('B')} · ${S.rows}×${S.cols}`,
    S.clearedFlag?tr('cleared'):tr('over')
  ];
  lines.forEach((t,i)=>x.fillText(t,W/2,580+i*56));
  x.fillStyle='#999';x.font='24px '+F;x.fillText(new Date().toLocaleString(),W/2,H-50);
  cv.toBlob(b=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='pop-colores-score.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },'image/png');
}

// ---- 排行榜 ----
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function boardId(mode){const g=GRIDS[cfg.grid];return `${mode}_${g[0]*g[1]}_${cfg.set}_${cfg.range}`;}
function boardLabel(){const g=GRIDS[cfg.grid];return `${tr('pickMode')} ${cfg.mode} · ${g[0]}×${g[1]} · ${tr(cfg.set==='basic'?'basic':'adv')} · 0–${cfg.range}`;}
function lbTable(list,myUid){
  if(!list.length)return `<p>${L('empty')}</p>`;
  return '<table class="lb">'+list.map((e,i)=>`<tr class="${e.uid===myUid?'me':''}"><td>${i+1}</td><td>${esc(e.name)}</td><td>${e.score}</td><td>${fmt(e.secs)}</td></tr>`).join('')+'</table>';
}
async function lbAfterGame(){
  const area=document.getElementById('lbArea');
  if(!area||!S)return;
  const board=boardId(S.mode);
  area.innerHTML=`<p>${L('loading')}</p>`;
  if(!window.LB){area.innerHTML=`<p>${L('lbError')}</p>`;return;}
  try{
    const res=await window.LB.top(board);
    const list=res.list;
    const rank=S.score*100000+(99999-S.finalSecs);
    const me=list.find(e=>e.uid===res.uid);
    const tenth=list.length>=10?list[9].rank:-1;
    S.lb={board,rank};
    if(S.score<=0){area.innerHTML=`<p>${L('notTop')}</p>`+lbTable(list,res.uid);return;}
    if(me&&me.rank>=rank){area.innerHTML=`<p>${L('notBetter')}</p>`+lbTable(list,res.uid);return;}
    const qualifies=list.length<10||rank>tenth||(me&&rank>me.rank);
    if(!qualifies){area.innerHTML=`<p>${L('notTop')}</p>`+lbTable(list,res.uid);return;}
    let last='';try{last=localStorage.getItem('shushu_nick')||'';}catch(e){}
    area.innerHTML=`<p><b>${L('qualify')}</b></p>
      <input id="nick" class="nick" placeholder="${esc(tr('nickname'))}" value="${esc(last)}" oninput="clampNick(this)">
      <button class="big" id="upBtn" onclick="uploadScore()">${L('upload')}</button>`+lbTable(list,res.uid);
  }catch(e){console.error(e);area.innerHTML=`<p>${L('lbError')}</p>`;}
}
function clampNick(el){const a=[...el.value];if(a.length>12)el.value=a.slice(0,12).join('');}
async function uploadScore(){
  const inp=document.getElementById('nick');
  const name=[...inp.value.trim()].slice(0,12).join('');
  if(!name){inp.focus();return;}
  const btn=document.getElementById('upBtn');btn.disabled=true;
  const area=document.getElementById('lbArea');
  try{
    try{localStorage.setItem('shushu_nick',name);}catch(e){}
    await window.LB.submit(S.lb.board,{name,score:S.score,secs:S.finalSecs,hearts:S.hearts,cleared:S.clearedFlag});
    const res=await window.LB.top(S.lb.board);

      try{
        const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(norm));
        return Array.from(new Uint8Array(buf)).slice(0,8).map(b=>b.toString(16).padStart(2,'0')).join('');

<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'pop';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() })
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
